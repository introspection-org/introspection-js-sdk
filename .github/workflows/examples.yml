name: Examples

# Examples burn LLM tokens, so they're NOT run on every push.
#
# Triggers:
#   - workflow_dispatch  → manual run from the Actions UI / `gh workflow run`
#   - push of a v* tag   → verify release-time before publish picks up

on:
  workflow_dispatch:
    inputs:
      run_examples:
        description: "Run the OTel examples (burns LLM tokens)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-examples:
    name: Run examples
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run examples
        if: inputs.run_examples
        working-directory: examples/otel
        env:
          INTROSPECTION_TOKEN: ${{ secrets.INTROSPECTION_TOKEN }}
          INTROSPECTION_BASE_OTEL_URL: ${{ vars.INTROSPECTION_BASE_OTEL_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The dual-export example targets whatever collector these point at.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: ./run_all.sh

      # Docs snippets. Left out: files whose regions hardcode the docs'
      # runtime slugs (reference/javascript-run-task, identity/agents,
      # patterns/multi-tenant, patterns/trigger), files that need
      # service-account secrets (reference/auth-service-account,
      # patterns/add-to-your-app, patterns/web-chat), a browser redirect code
      # (reference/auth-hosted-login) or a Pipedream connector
      # (patterns/per-user-tools*). browser/ is typecheck-only.
      - name: Run docs snippets
        if: inputs.run_examples
        working-directory: examples
        env:
          INTROSPECTION_TOKEN: ${{ secrets.INTROSPECTION_TOKEN }}
          INTROSPECTION_BASE_OTEL_URL: ${{ vars.INTROSPECTION_BASE_OTEL_URL }}
        run: |
          node --import tsx reference/auth-api-key.ts
          node --import tsx reference/javascript.ts
          node --import tsx reference/javascript-feedback.ts
          node --import tsx observe/feedback-events.ts
          node --import tsx identity/sharing.ts
          node --import tsx patterns/agent-follow-ups.ts
          node --import tsx patterns/approve-outside.ts
          node --import tsx patterns/ask-the-user.ts
          node --import tsx patterns/files.ts
          node --import tsx patterns/structured-output.ts
