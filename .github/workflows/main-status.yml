name: Main Status

on:
  workflow_run:
    workflows:
      [
        "CI",
        "Publish to npm",
        "Publish the AAuth packages to npm",
        "Release Please",
      ]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Evaluate this run id; empty sends a test message instead"
        required: false
        type: string
      run_attempt:
        description: "Evaluate this attempt; empty selects the latest attempt"
        required: false
        type: string
      post_for_real:
        description: "Post to Slack instead of printing the message"
        required: false
        default: false
        type: boolean

permissions:
  actions: read

jobs:
  alert:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    uses: introspection-org/introspection-action/.github/workflows/main-status.yml@9a3ec92c0d09530a2193a484b56ff9ea61e5482c
    with:
      run_id: ${{ inputs.run_id || '' }}
      run_attempt: ${{ inputs.run_attempt || '' }}
      release_workflows: ".github/workflows/publish.yml,.github/workflows/publish-aauth.yml"
      post_for_real: ${{ github.event_name == 'workflow_run' || inputs.post_for_real == true }}
    secrets:
      slack_webhook_url: ${{ secrets.MAIN_STATUS_SLACK_WEBHOOK_URL }}
