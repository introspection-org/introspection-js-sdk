# Runs the full API contract check after each staging deploy: the operations
# the staging references (each plane's /openapi.json) mark for every client or
# for the SDK that it never calls, and the routes it calls that staging does
# not have. introspection-cloud sends the api-reference-deployed event after
# each staging deploy of either plane, with the cloud commit in
# client_payload.sha, the plane (cp or dp) in client_payload.plane and both
# planes' base URLs in client_payload.cp_url and client_payload.dp_url. Both
# planes are checked either way.
#
# Neither plane has a fixed host here. A dispatched run takes the URLs from
# its payload and, once it has read both references, saves them in the
# Actions cache (api-reference-urls-*, next to api-drift-state-*). A manual
# run takes the cp_url and dp_url inputs; each one left empty, and every
# pull request run in ci.yml, comes from the newest saved pair. With none
# saved yet the run fails and says so: run introspection-cloud's "API
# Reference Deployed" workflow by hand, which dispatches here and refills the
# cache, or pass both inputs.
#
# A reference that cannot be read (404 included) fails the run but writes no
# state, so the steps after the check skip: nothing is posted and the recorded
# drift state stays as it was.
#
# Pull requests run the same check from ci.yml with --pr, where an uncalled
# operation is only reported: a new cloud route must not block unrelated PRs.
#
# A red run that nobody opens is ignorable, so this run tells
# #main-build-alerts when the state changes (clean to drift, drift to clean),
# with the drift it found and a link to the run.
#
# Slack posting rule, the same in every repo: only a run on main may post, and
# a manual run only when its post_for_real input is set. Every other run
# prints the message instead.
name: API Contract

on:
  repository_dispatch:
    types: [api-reference-deployed]
  workflow_dispatch:
    inputs:
      post_for_real:
        description: Post to Slack on a state change, as a deploy-triggered run does. Off prints the message instead.
        type: boolean
        default: false
      cp_url:
        description: Control plane base URL. Empty takes the one the last deploy-triggered run saved.
        type: string
        default: ""
      dp_url:
        description: Data plane base URL. Empty takes the one the last deploy-triggered run saved.
        type: string
        default: ""

permissions:
  contents: read

# One run at a time, so two deploys in quick succession read and write the
# posted state in order.
concurrency:
  group: api-contract
  cancel-in-progress: false

jobs:
  sdk-routes:
    name: SDK routes vs staging reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # Only the TypeScript compiler is needed, to find the routes the SDK
      # calls — the packages themselves are never built.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The URLs the last deploy-triggered run saved, newest first by prefix.
      - name: Restore the staging reference URLs
        uses: actions/cache/restore@v5
        with:
          path: .api-reference-urls
          key: api-reference-urls-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-reference-urls-

      - name: Pick the staging reference URLs
        env:
          URLS_DIR: .api-reference-urls
          CP_URL: ${{ github.event.client_payload.cp_url || inputs.cp_url }}
          DP_URL: ${{ github.event.client_payload.dp_url || inputs.dp_url }}
        run: scripts/api-reference-urls.sh

      # A reference that could not be read writes no state: the steps below
      # then skip, so the run is red but posts nothing and records no state.
      - name: Check the SDK routes
        id: check
        run: |
          status=0
          node scripts/check-api-contract.mjs --out "${RUNNER_TEMP}/api-contract" || status=$?
          if [ -f "${RUNNER_TEMP}/api-contract/state" ]; then
            { echo '```'; cat "${RUNNER_TEMP}/api-contract/report.txt"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            echo "checked=true" >> "${GITHUB_OUTPUT}"
          fi
          # 1 is drift, reported below; 2 is a reference that could not be read.
          [ "${status}" -le 1 ]

      # Only a deploy-triggered run that read both references records its
      # URLs, so a bad payload never replaces a working pair.
      - name: Save the staging reference URLs
        if: github.event_name == 'repository_dispatch' && steps.check.outputs.checked == 'true'
        uses: actions/cache/save@v5
        with:
          path: .api-reference-urls
          key: api-reference-urls-${{ github.run_id }}-${{ github.run_attempt }}

      # The state of the last real post. Caches are immutable, so each post
      # saves under a new key and the newest one is restored by prefix.
      - name: Restore the last posted state
        if: steps.check.outputs.checked == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .api-drift-state
          key: api-drift-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-drift-state-

      - name: Notify #main-build-alerts
        if: steps.check.outputs.checked == 'true'
        id: notify
        env:
          REPORT_DIR: ${{ runner.temp }}/api-contract
          STATE_DIR: .api-drift-state
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUD_SHA: ${{ github.event.client_payload.sha }}
          # Posts only from main, whose cache holds the state, and from a manual
          # run only with post_for_real; otherwise, or with the secret unset,
          # the message is printed.
          SLACK_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.post_for_real) && secrets.MAIN_STATUS_SLACK_WEBHOOK_URL || '' }}
        run: scripts/api-drift-notify.sh

      - name: Save the posted state
        if: steps.notify.outputs.posted == 'true'
        uses: actions/cache/save@v5
        with:
          path: .api-drift-state
          key: api-drift-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail on drift
        if: steps.check.outputs.checked == 'true'
        run: |
          if [ "$(cat "${RUNNER_TEMP}/api-contract/state")" = "red" ]; then
            echo "::error::API drift found; the job summary lists it."
            exit 1
          fi
