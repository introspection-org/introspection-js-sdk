version: 2

updates:
  # ── npm (root + every package, examples, tests via workspace discovery) ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Majors open PRs too, and dependabot-auto-merge.yml leaves them for a
    # human: ignoring them hid every 0.0.x package that went 1.0 (@ag-ui/core).
    # Watch ALL workspace deps (production, dev, optional, peer). The grouping
    # config below is what does the curation — `allow: production` was
    # contradicting it and leaving the AI provider packages in
    # tests/package.json devDependencies (and previously optionalDependencies)
    # unwatched, so they would drift indefinitely. Routine tooling bumps still
    # flow but are consolidated into the groups below.
    allow:
      - dependency-type: "all"
    groups:
      # `applies-to: all` (default-ish) covers BOTH scheduled version updates
      # AND security-alert PRs — so security fixes get rolled up along the
      # same boundaries as routine bumps. One PR per group, not one per alert.

      # OTel moves as a fleet — keep all @opentelemetry/* in one PR.
      otel:
        applies-to: version-updates
        patterns:
          - "@opentelemetry/*"
      otel-security:
        applies-to: security-updates
        patterns:
          - "@opentelemetry/*"

      # AI provider SDKs + pi-mono peers travel together, often in lockstep.
      pi-peers:
        applies-to: version-updates
        patterns:
          - "@earendil-works/*"
      pi-peers-security:
        applies-to: security-updates
        patterns:
          - "@earendil-works/*"

      # Everything else lands in at most three weekly PRs. A group takes a
      # dependency only if no group above it did, so otel and Pi stay apart.
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Majors of dev tooling arrive together; one that cannot land yet goes
      # in `ignore` below with its reason, so it never holds the rest back.
      dev-major:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["major"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      # Production majors are left ungrouped: each changes what SDK users get.

      # Catch-all for any security alert not matching a more specific group —
      # rolls up everything else (transitive deps, optional peers, etc.) into
      # one PR rather than one-PR-per-alert.
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Track the oldest Node in `engines` (>=22), not the newest @types/node.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Held until typescript-eslint supports it (its peer is <6.1.0).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # Held until eslint-plugin-react, -import and -jsx-a11y accept ESLint 10.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]

  # ── GitHub Actions (used by ci.yml / publish.yml / tag.yml) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
