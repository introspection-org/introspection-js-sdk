version: 2

updates:
  # ── npm (root + every package, examples, tests via workspace discovery) ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Watch ALL workspace deps (production, dev, optional, peer). The grouping
    # config below is what does the curation — `allow: production` was
    # contradicting it and leaving the AI provider packages in
    # tests/package.json devDependencies (and previously optionalDependencies)
    # unwatched, so they would drift indefinitely. Routine tooling bumps still
    # flow but are consolidated into the `typescript-tooling` group below.
    allow:
      - dependency-type: "all"
    groups:
      # `applies-to: all` (default-ish) covers BOTH scheduled version updates
      # AND security-alert PRs — so security fixes get rolled up along the
      # same boundaries as routine bumps. One PR per group, not one per alert.

      # OTel moves as a fleet — keep all @opentelemetry/* in one PR.
      otel:
        applies-to: version-updates
        patterns:
          - "@opentelemetry/*"
      otel-security:
        applies-to: security-updates
        patterns:
          - "@opentelemetry/*"

      # AI provider SDKs + pi-mono peers travel together, often in lockstep.
      pi-peers:
        applies-to: version-updates
        patterns:
          - "@earendil-works/*"
      pi-peers-security:
        applies-to: security-updates
        patterns:
          - "@earendil-works/*"

      # TypeScript / test toolchain.
      typescript-tooling:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "tsx"
          - "vitest"
          - "@types/*"
          - "eslint"
          - "@typescript-eslint/*"
          - "prettier"
      typescript-tooling-security:
        applies-to: security-updates
        patterns:
          - "typescript"
          - "tsx"
          - "vitest"
          - "@types/*"
          - "eslint"
          - "@typescript-eslint/*"
          - "prettier"

      # Catch-all for any security alert not matching a more specific group —
      # rolls up everything else (transitive deps, optional peers, etc.) into
      # one PR rather than one-PR-per-alert.
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Major bumps still produce alerts — but don't auto-PR; require a human.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ── GitHub Actions (used by ci.yml / publish.yml / tag.yml) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
