schema_version = "1.1"

[task]
name = "trivia-host/night0-manchester"
description = "Seeds the venue's true notes (The Crown, Manchester) in memories/MEMORY.md for the perfect-notes night 2; no quiz is played"

[metadata]
case = "C3"
venue = "page-manchester"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[[artifacts]]
source = "/workspace/memories"
destination = "memories"
