services:
  main:
    depends_on:
      fakes:
        condition: service_healthy
    volumes:
      - fakes-verifier:/opt/fakes-verifier:ro
  # The trial's pub, night and crowd reach the bank as its environment
  # (trivia-tasks.mjs bankEnvironment), which the page sets per trial.
  fakes:
    build:
      context: ../../../../fakes
    volumes:
      - fakes-verifier:/verifier
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7353/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 1s
      retries: 30
volumes:
  fakes-verifier: {}
