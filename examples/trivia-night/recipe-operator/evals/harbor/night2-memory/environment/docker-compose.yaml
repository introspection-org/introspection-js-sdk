services:
  main:
    depends_on:
      fakes:
        condition: service_healthy
    volumes:
      - fakes-verifier:/opt/fakes-verifier:ro
      # Local only: the previous night's memories, copied here by the series script.
      - ./seed-memories:/workspace/memories
  fakes:
    build:
      context: ../../../../fakes
    environment:
      EVAL_SIMULATE_SCENARIO: case-c3
      EVAL_SIMULATE_MANIFEST_DIR: /verifier
    volumes:
      - fakes-verifier:/verifier
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7353/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 1s
      retries: 30
volumes:
  fakes-verifier: {}
