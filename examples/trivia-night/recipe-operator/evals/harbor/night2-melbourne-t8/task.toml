schema_version = "1.1"

[task]
name = "trivia-host/night2-melbourne-t8"
description = "The second night at The Esplanade, Melbourne: six rounds to a simulated crowd, most of it night 1's teams, pitched from the identity's own memory or from nothing"

[metadata]
case = "C3"
venue = "page-melbourne"

[verifier]
timeout_sec = 120.0

[agent]
