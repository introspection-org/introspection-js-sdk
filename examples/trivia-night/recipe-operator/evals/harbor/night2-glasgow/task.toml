schema_version = "1.1"

[task]
name = "trivia-host/night2-glasgow"
description = "The second night at The Anchor, Glasgow, on the platform: the notes come from the identity's own memory"

[metadata]
case = "C3"
venue = "held-7-shifting"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[[artifacts]]
source = "/workspace/memories"
destination = "memories"
