# `main` is the agent container. Its notes for this venue are in place, as a
# past night would have left them; the bank is a fresh sidecar for the venue.
services:
  main:
    depends_on:
      bank:
        condition: service_healthy
    volumes:
      - ./memories:/workspace/memories

  bank:
    build:
      context: ../../../../fakes/mcp/trivia-bank
    expose:
      - "8000"
    environment:
      PORT: "8000"
      TRIVIA_DEV_OWNER: user:quiz-and-quill
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
