name: close-finish
description: Did the night stay competitive to the end?

instructions: |
  You are reading one pub quiz night. The `submit_round` tool results carry
  tonight's `standings`, and the `scoreboard` tool result carries the final
  ones.

  Read the final standings: the last `scoreboard` result with scope tonight,
  or else the last `submit_round` result's `standings`.

  Return `pass` when the winner finished at most 2 points ahead of second
  place. Return `fail` when the lead was more than 2 points, or when there are
  no final standings.

ai:
  model: anthropic/claude-haiku-5-5
  thinking_level: low
